name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Run linter (ruff)
        working-directory: ./src/backend
        run: |
          ruff check src/ tests/ --exit-zero
          ruff format src/ tests/ --check --diff

      - name: Run type checker (mypy)
        working-directory: ./src/backend
        run: |
          mypy src/ \
            --ignore-missing-imports \
            --pretty \
            --disable-error-code=assignment \
            --disable-error-code=attr-defined \
            --disable-error-code=return-value \
            --disable-error-code=arg-type \
            --disable-error-code=call-arg \
            --disable-error-code=misc \
            --disable-error-code=list-item \
            --disable-error-code=annotation-unchecked

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: poll_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        working-directory: ./src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run tests with coverage
        working-directory: ./src/backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/poll_system_test
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/poll_system_test
          SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-prod
          REFRESH_SECRET_KEY: test-refresh-key-for-ci-only
          APP_ENV: testing
          LOG_LEVEL: DEBUG
          OPENWEATHER_API_KEY: test-key-for-mocking
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            --maxfail=3 \
            --tb=short

      - name: Upload coverage to Codecov (опционально)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./src/backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
  
      - name: Install dependencies
        working-directory: ./src/frontend
        run: npm install --legacy-peer-deps
  
      - name: Run unit tests
        working-directory: ./src/frontend
        env:
          CI: true
        run: npm run test:unit
  
      - name: Upload Playwright report (if failed)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ""
          cache-to: ""
          provenance: false

      - name: Output image digest
        run: |
          echo "Pushed image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}"

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    timeout-minutes: 15
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy locally
        shell: cmd
        run: |
          echo "Starting deployment on local Windows machine..."
          cd /d C:\Courses\Course_3\FS
          
          echo "Pulling latest code..."
          git pull origin main
          
          echo "Rebuilding and restarting containers..."
          docker compose up -d --build
          
          echo "Deployment completed successfully!"